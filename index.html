const motionMedia = matchMedia('(prefers-reduced-motion: reduce)');
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

function mountInteractions(root) {
  const surface = root.querySelector('.tennis-surface');
  if (!surface) return () => {};
  const controller = new AbortController(), {signal} = controller;
  const ball = surface.querySelector('.tennis-ball');
  const startButton = surface.querySelector('[data-tennis-start]');
  const overlay = surface.querySelector('.tennis-overlay');
  const pauseButton = root.querySelector('[data-game-pause]');
  const status = root.querySelector('.game-status');
  const scoreLabel = surface.querySelector('[data-tennis-score]');
  const bestLabel = surface.querySelector('[data-tennis-best]');
  const landingPoints = [.32, .7, .42, .64, .26, .55];
  let state = 'idle', phase = 'incoming', hits = 0, best = 0, frame = 0, swingTimer = 0;
  let progress = 0, previousTime = 0, targetX = .5, returnX = .5;
  let ballX = .5, ballY = .29, racketX = .5, racketY = .79, hitX = .5, hitY = .7;

  const setState = value => {
    state = value; surface.dataset.tennisState = value;
    surface.classList.toggle('is-playing', value === 'playing');
    overlay.hidden = value === 'playing';
    pauseButton.hidden = value !== 'playing';
  };
  const position = (x, y, scale = 1) => {
    ballX = x; ballY = y;
    surface.style.setProperty('--ball-x', `${x * 100}%`);
    surface.style.setProperty('--ball-y', `${y * 100}%`);
    surface.style.setProperty('--ball-scale', scale);
    surface.style.setProperty('--landing-x', `${targetX * 100}%`);
    ball.dataset.direction = phase;
  };
  const moveRacket = (x, y) => {
    racketX = clamp(x, .07, .93); racketY = clamp(y, .15, .93);
    surface.style.setProperty('--racket-x', `${racketX * 100}%`);
    surface.style.setProperty('--racket-y', `${racketY * 100}%`);
    surface.style.setProperty('--player-shift', `${(racketX - .5) * 390}px`);
  };
  const nearBall = () => {
    const box = surface.getBoundingClientRect();
    return Math.hypot((racketX - ballX) * box.width, (racketY - ballY) * box.height) < Math.max(31, box.width * .065);
  };
  const staticBall = () => {
    phase = 'incoming'; progress = .8;
    targetX = landingPoints[hits % landingPoints.length];
    position(targetX, .65, 1.05);
  };
  const strike = () => {
    if (state !== 'playing' || phase !== 'incoming' || !nearBall() || (!motionMedia.matches && progress < .3)) return false;
    hits++; best = Math.max(best, hits);
    scoreLabel.textContent = hits; bestLabel.textContent = best; surface.dataset.hits = hits;
    status.textContent = `漂亮！已连续回球 ${hits} 次。`;
    surface.classList.remove('tennis-hit'); void surface.offsetWidth; surface.classList.add('tennis-hit');
    clearTimeout(swingTimer); swingTimer = setTimeout(() => surface.classList.remove('tennis-hit'), 350);
    if (motionMedia.matches) staticBall();
    else {
      hitX = ballX; hitY = ballY; returnX = clamp(.5 + (racketX - .5) * .22, .36, .64);
      phase = 'outgoing'; progress = 0;
    }
    return true;
  };
  const stopFrame = () => {cancelAnimationFrame(frame); frame = 0; previousTime = 0;};
  const finish = () => {
    stopFrame(); setState('finished');
    startButton.innerHTML = '再来一局 <span aria-hidden="true">↗</span>';
    status.textContent = hits ? `这一局连续回球 ${hits} 次，再试一次？` : '差一点！移动球拍接住来球，再试一次。';
  };
  const tick = now => {
    frame = 0;
    if (state !== 'playing' || motionMedia.matches) return;
    const elapsed = previousTime ? Math.min((now - previousTime) / 1000, .05) : 0;
    previousTime = now;
    if (phase === 'incoming') {
      progress += elapsed / Math.max(1.8, 2.8 - hits * .065);
      const t = Math.min(progress, 1);
      position(.5 + (targetX - .5) * t, .28 + .57 * t - Math.sin(t * Math.PI) * .12, .42 + t * .95);
      strike();
      if (phase === 'incoming' && progress >= 1) {finish(); return;}
    } else {
      progress += elapsed / .9;
      const t = Math.min(progress, 1), ease = 1 - Math.pow(1 - t, 1.25);
      position(hitX + (returnX - hitX) * ease, hitY + (.28 - hitY) * ease - Math.sin(t * Math.PI) * .18, 1.2 - ease * .8);
      if (progress >= 1) {
        phase = 'incoming'; progress = 0; targetX = landingPoints[hits % landingPoints.length];
      }
    }
    if (state === 'playing') frame = requestAnimationFrame(tick);
  };
  const start = () => {
    if (state !== 'paused') {
      hits = 0; progress = 0; phase = 'incoming'; targetX = .5;
      scoreLabel.textContent = '0'; surface.dataset.hits = '0'; position(.5,.28,.42);
    }
    setState('playing');
    status.textContent = motionMedia.matches ? '移动球拍靠近网球，点击或按空格回球。' : '看准来球，移动球拍把它打回去。';
    surface.focus({preventScroll:true}); stopFrame();
    if (motionMedia.matches) staticBall(); else frame = requestAnimationFrame(tick);
  };
  const pause = () => {
    if (state !== 'playing') return;
    stopFrame(); setState('paused');
    startButton.innerHTML = '继续接球 <span aria-hidden="true">↗</span>';
    status.textContent = '已暂停，准备好再继续。';
  };
  const reset = () => {
    stopFrame(); clearTimeout(swingTimer);
    hits = 0; progress = 0; phase = 'incoming'; targetX = .5;
    surface.dataset.hits = '0'; scoreLabel.textContent = '0'; surface.classList.remove('tennis-hit'); setState('idle');
    moveRacket(.5,.79); position(.5,.29,.5);
    startButton.innerHTML = '开始接球 <span aria-hidden="true">↗</span>';
    status.textContent = '准备好，来一场轻松的对打。';
  };
  const locate = event => {
    if (state !== 'playing' || event.target.closest('button')) return;
    const box = surface.getBoundingClientRect();
    moveRacket((event.clientX - box.left) / box.width, (event.clientY - box.top) / box.height);
    if (motionMedia.matches) strike();
  };
  surface.addEventListener('pointermove', locate, {signal, passive:true});
  surface.addEventListener('pointerdown', event => {
    locate(event);
    if (state === 'playing' && !event.target.closest('button')) {
      if (event.pointerType !== 'mouse') surface.setPointerCapture(event.pointerId);
      surface.focus({preventScroll:true}); strike();
    }
  }, {signal, passive:true});
  surface.addEventListener('keydown', event => {
    if (event.target !== surface) return;
    if (event.code === 'Escape') {event.preventDefault(); pause(); return;}
    if (event.code === 'Space' || event.code === 'Enter') {
      event.preventDefault(); if (state !== 'playing') start(); else strike(); return;
    }
    const direction = {ArrowLeft:[-.055,0],ArrowRight:[.055,0],ArrowUp:[0,-.075],ArrowDown:[0,.075]}[event.code];
    if (!direction || state !== 'playing') return;
    event.preventDefault(); moveRacket(racketX + direction[0], racketY + direction[1]);
    if (motionMedia.matches) strike();
  }, {signal});
  startButton.addEventListener('click', start, {signal});
  pauseButton.addEventListener('click', pause, {signal});
  root.querySelector('[data-game-reset]').addEventListener('click', reset, {signal});
  const observer = new IntersectionObserver(entries => {if (!entries[0].isIntersecting) pause();}, {threshold:0});
  observer.observe(surface);
  document.addEventListener('visibilitychange', () => {if (document.hidden) pause();}, {signal});
  motionMedia.addEventListener('change', () => {
    stopFrame(); surface.classList.remove('tennis-hit'); if (state !== 'playing') return;
    if (motionMedia.matches) {staticBall(); status.textContent = '移动球拍靠近网球，点击或按空格回球。';}
    else frame = requestAnimationFrame(tick);
  }, {signal});
  reset();
  return () => {controller.abort(); observer.disconnect(); stopFrame(); clearTimeout(swingTimer);};
}


function mountSiteChrome(root) {
  const controller = new AbortController();
  const { signal } = controller;
  const header = root.querySelector('.site-header');
  const content = root.querySelector('.nav-content');
  const reopen = root.querySelector('.nav-reopen');
  const collapse = root.querySelector('.nav-collapse');
  const fine = matchMedia('(hover: hover) and (pointer: fine)');

  const update = () => {
    const focused = header.contains(document.activeElement) && document.activeElement !== reopen;
    const expanded = !scrolled || pinned || hovered || focused || menuOpen();
    header.classList.toggle('is-scrolled', scrolled);
    header.classList.toggle('is-expanded', expanded);
    content.inert = !expanded;
    reopen.hidden = expanded;
    reopen.setAttribute('aria-expanded', String(expanded));
    collapse.hidden = !scrolled || !expanded;
  };
  const close = (restoreFocus = false) => {
    pinned = hovered = false; clearTimeout(hoverTimer);
    const menu = root.querySelector('.menu-toggle');
    if (menuOpen()) menu.click();
    if (header.contains(document.activeElement)) document.activeElement.blur();
    update();
    if (restoreFocus && scrolled) reopen.focus({ preventScroll: true });
  };
  const scroll = () => {
    ring.classList.remove('is-visible');
    if (navFrame) return;
    navFrame = requestAnimationFrame(() => {
      navFrame = 0;
      const next = scrolled ? scrollY > 70 : scrollY > 130;
      if (next !== scrolled) { scrolled = next; hovered = false; pinned = false; clearTimeout(hoverTimer); }
      update();
    });
  };
  addEventListener('scroll', scroll, { signal, passive: true });
  header.addEventListener('pointerenter', (event) => {
    if (!fine.matches || event.pointerType !== 'mouse' || !scrolled) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => { hovered = true; update(); }, 160);
  }, { signal });
  header.addEventListener('pointerleave', () => { clearTimeout(hoverTimer); hovered = false; update(); }, { signal });
  header.addEventListener('focusin', update, { signal });
  header.addEventListener('focusout', () => queueMicrotask(update), { signal });
  reopen.addEventListener('click', () => {
    clearTimeout(hoverTimer); pinned = true; update();
    if (mobile.matches) { if (!menuOpen()) root.querySelector('.menu-toggle').click(); }
    else root.querySelector('.site-header .brand').focus({ preventScroll: true });
  }, { signal });
  collapse.addEventListener('click', () => close(true), { signal });
  root.querySelector('.menu-toggle')?.addEventListener('click', () => queueMicrotask(update), { signal });
  document.addEventListener('pointerdown', (event) => {
    if (scrolled && !header.contains(event.target) && (pinned || menuOpen())) close();
  }, { signal });
  document.addEventListener('keydown', (event) => {
    ring.classList.remove('is-visible');
    if (event.key === 'Escape' && scrolled && header.classList.contains('is-expanded')) close(true);
  }, { signal });
  mobile.addEventListener('change', () => { pinned = false; hovered = false; update(); }, { signal });
  update();

  const draw = () => {
    ringFrame = 0;
    x += (targetX - x) * .24; y += (targetY - y) * .24;
    ring.style.transform = `translate3d(${x - 18}px, ${y - 18}px, 0)`;
    if (Math.abs(targetX - x) + Math.abs(targetY - y) > .15) ringFrame = requestAnimationFrame(draw);
  };
  document.addEventListener('pointermove', (event) => {
    if (!fine.matches || reduced.matches || event.pointerType !== 'mouse') { ring.classList.remove('is-visible'); return; }

    const interactive = el.closest('a,button,summary');
    const quiet = el.closest('input,textarea,select,[contenteditable],.search-field,.play-surface,.article-content,.faq-list p');
    const support = (new URLSearchParams(location.search).get('page') || '/').startsWith('/support');
    if (quiet || (support && !interactive)) { ring.classList.remove('is-visible'); return; }
    targetX = event.clientX; targetY = event.clientY;
    if (!hasPointer || !ring.classList.contains('is-visible')) { x = targetX; y = targetY; hasPointer = true; }
    ring.classList.add('is-visible'); ring.classList.toggle('is-interactive', Boolean(interactive));
    ring.classList.toggle('on-purple', Boolean(el.closest('.product-hero,.connection-section,.site-footer')));

  };
  fine.addEventListener('change', disable, { signal }); reduced.addEventListener('change', disable, { signal });
  return () => {
    controller.abort(); cancelAnimationFrame(navFrame); cancelAnimationFrame(ringFrame);
    clearTimeout(hoverTimer); clearTimeout(pulseTimer); ring.remove();
  };
}

  return `<footer class="site-footer"><div class="footer-atmosphere" aria-hidden="true"><i></i><i></i><i></i></div><div class="container footer-top"><div class="footer-brand"><a class="brand" href="/">${logo}</a><p>家庭体感娱乐</p></div><div class="footer-col"><h3>品牌</h3><a href="/about">关于我们</a><a href="/news">新闻中心</a><a href="/buy">购买渠道</a></div><div class="footer-col"><h3>支持</h3><a href="/support">教程中心</a><a href="/support#contact">联系客服</a>${brand.email ? `<a href="mailto:${escape(brand.email)}">${escape(brand.email)}</a>` : ''}</div><div class="footer-col"><h3>关注我们</h3>${brand.socials.map((item) => channelLink(item, 'social-link', escape(item.name))).join('')}</div></div><div class="container footer-bottom"><span>© ${new Date().getFullYear()} 灵境筑梦</span><span class="preview-label"><i></i>框架预览 · 产品视觉、品牌文案与文章为示例</span>${brand.icp ? `<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">${escape(brand.icp)}</a>` : ''}</div></footer>`;
}

function newsCard(item) {
  return `<a class="news-card" href="/news/${item.slug}"><div class="news-cover tone-${item.tone}">${art(item.visual)}<span class="cover-arrow">${arrow}</span></div><div class="card-meta"><span>${item.category}</span><time datetime="${item.date}">${item.date.replaceAll('-', '.')}</time></div><h3>${item.title}</h3><p>${item.excerpt}</p></a>`;
}
function home() { return homeMarkup({ button, news, newsCard }); }

function pageHero(kicker, title, description = '', extra = '') {
  return `<section class="page-hero"><div class="container"><h1>${title}</h1>${description ? `<p>${description}</p>` : ''}${extra}</div></section>`;
}

function newsPage() {
  return `<main id="main">${pageHero('', '新闻中心')}<section class="container listing-section"><div class="listing-tools"><div class="filter-tabs" role="group" aria-label="新闻分类">${['全部', '品牌动态', '产品资讯', '灵感故事'].map((category, i) => `<button data-news-category="${category}" class="${i === 0 ? 'selected' : ''}" aria-pressed="${i === 0}">${category}</button>`).join('')}</div><label class="search-field">${searchIcon}<input id="news-search" type="search" placeholder="搜索新闻" aria-label="搜索新闻" autocomplete="off" /></label></div><div class="list-caption"><span id="news-count" aria-live="polite"></span></div><div class="news-grid" id="news-results">${news.map(newsCard).join('')}</div></section></main>`;
}

function tutorialCard(item) {
  return `<a href="/support/${item.slug}" class="tutorial-card"><h3>${item.title}</h3><span class="tutorial-arrow">${arrow}</span></a>`;
}

function supportPage() {
  const contact = [brand.email ? `<a href="mailto:${escape(brand.email)}">${escape(brand.email)}</a>` : '',brand.phone ? `<a href="tel:${escape(brand.phone)}">${escape(brand.phone)}</a>` : ''].filter(Boolean);
  return `<main id="main" class="support-page">${pageHero('','技术支持','',`<label class="search-field support-search">${searchIcon}<input id="support-search" type="search" placeholder="搜索：连接电视、画面、声音……" aria-label="搜索教程" autocomplete="off" /></label>`)}<section class="container support-body"><div class="support-layout"><div><h2>使用教程</h2><p id="support-count" class="support-search-status" aria-live="polite"></p><div id="support-results" class="support-list">${tutorials.map(tutorialCard).join('')}</div></div><div><h2>常见问题</h2><div class="faq-list">${faqs.map(([q,a])=>`<details><summary>${q}<span aria-hidden="true">+</span></summary><p>${a}</p></details>`).join('')}</div></div></div><div class="support-contact" id="contact"><h2>联系客服</h2>${contact.length ? `<div class="support-contact-links">${contact.join('')}</div>` : '<p>联系方式准备中</p>'}</div></section></main>`;
}

function aboutPage() {
  return `<main id="main">${pageHero('', '关于灵境筑梦')}<section class="container about-product"><div><h2>我们做客厅里的<br>体感娱乐产品。</h2><p>电视前的空间，可以用来运动、游戏，也可以让家人一起参与。</p><p>灵境筑梦关注这样的家庭时刻：大人和孩子站到同一块屏幕前，用身体参与游戏，分享同一局里的快乐。</p></div><figure>${roomArt()}<figcaption>家庭使用场景示意</figcaption></figure></section><section class="about-focus"><div class="container"><h2>我们关心的是，<br>一家人怎么一起玩。</h2><div class="about-focus-copy"><p>容易开始，才愿意再玩一局。共同参与，才有一起讨论的故事。</p><p>我们希望把产品、游戏内容和使用帮助放在一条清晰的体验路径里，让家庭体感娱乐更容易走进日常。</p></div></div></section><section class="container about-links"><a href="/news"><span>品牌动态</span>${arrow}</a><a href="/support#contact"><span>联系与合作</span>${arrow}</a></section></main>`;
}

function buyPage() {
  const platformPreview = brand.shops.some(shop => shop.kind === 'platform');
  return `<main id="main" class="purchase-page"><section class="container purchase-layout"><figure class="purchase-visual">${purchaseArt()}<figcaption>产品外观示意</figcaption></figure><div class="purchase-copy"><h1>把下一局，<br>留给<span>全家。</span></h1><p>选一个常用的平台，准备一起开玩。</p><div class="purchase-channels" aria-label="购买渠道">${brand.shops.map(shop => channelLink(shop, 'purchase-button shop-link', `<img class="platform-logo" src="${escape(shop.logo)}" alt="" width="28" height="28" /><span>${escape(shop.name)}</span>`)).join('')}</div>${platformPreview ? '<small class="purchase-note">暂跳转平台官网，品牌店铺后续上线。</small>' : ''}</div></section></main>`;
}

function articlePage(item, tutorial = false) {
  const base = tutorial ? '/support' : '/news';
  const sections = tutorial ? item.sections : item.body;
  const related = (tutorial ? tutorials : news).filter((entry) => entry.slug !== item.slug).slice(0, 3);
  return `<main id="main"><div class="container article-container"><a class="back-link" href="${base}">← 返回${tutorial ? '教程中心' : '新闻中心'}</a><header class="article-header"><h1>${item.title}</h1><div class="article-meta"><span>${item.category}</span>${!tutorial ? '<span>' + item.date.replaceAll('-', '.') + '</span>' : ''}<span class="demo-badge">${tutorial ? '示例教程' : '演示文章'}</span><button class="share-button" data-share>分享链接 ↗</button></div></header>${!tutorial ? `<div class="article-cover tone-${item.tone}">${art(item.visual)}</div>` : ''}<div class="article-layout"><article class="article-content"><div class="article-notice">${tutorial ? '本页用于预览教程框架，不作为真实产品的操作说明。' : '本文为官网原型的示例内容，不代表真实品牌新闻或产品声明。'}</div>${sections.map(([title, text], i) => `<section id="section-${i}"><h2>${title}</h2><p>${text}</p></section>`).join('')}<div class="article-end"><span></span>${button(base, tutorial ? '更多教程' : '更多故事', 'button-outline')}</div></article><aside class="article-toc"><span>本页目录</span>${sections.map(([title], i) => `<a href="#section-${i}">${title}</a>`).join('')}<a class="toc-contact" href="/support#contact">需要帮助？联系与支持 ↗</a></aside></div><div class="related-section"><h2>${tutorial ? '相关教程' : '继续阅读'}</h2><div class="${tutorial ? 'tutorial-grid' : 'news-grid'}">${related.map(tutorial ? tutorialCard : newsCard).join('')}</div></div></div></main>`;
}
function notFound() { return `<main id="main" class="not-found container"><span class="eyebrow">404 / A NEW DIRECTION</span><h1>这里暂时没有内容。</h1><p>换一个入口，继续探索灵境。</p>${button('/', '回到首页', 'button-dark')}</main>`; }

let observer;
let stepObserver;
let scrollHandler;
let disposeInteractions;
let disposeChrome;
let toastTimer;
let newsCategory = '全部';
let supportCategory = '全部';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
function toast(message) {
  $('#toast').textContent = message;
  $('#toast').classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('visible'), 3500);
}
function filterNews() {
  const query = ($('#news-search')?.value || '').trim().toLowerCase();
  const results = news.filter((item) => (newsCategory === '全部' || item.category === newsCategory) && `${item.title}${item.excerpt}${item.category}`.toLowerCase().includes(query));
  $('#news-results').innerHTML = results.length ? results.map(newsCard).join('') : '<div class="empty-state"><span>⌕</span><h3>暂时没有找到相关动态</h3><p>试试其他关键词，或切换到全部分类。</p><button class="button button-outline" data-reset-news>清除筛选</button></div>';
  $('#news-count').textContent = `共 ${results.length} 篇文章`;
}
function filterSupport() {
  const query = ($('#support-search')?.value || '').trim().toLowerCase();
  const results = tutorials.filter((item)=>`${item.title}${item.summary}${item.category}`.toLowerCase().includes(query));
  $('#support-results').innerHTML = results.length ? results.map(tutorialCard).join('') : '<div class="empty-state"><h3>没有找到相关教程</h3><p>试试其他关键词。</p><button class="button button-outline" data-reset-support>清除搜索</button></div>';
  $('#support-count').textContent = query ? `找到 ${results.length} 篇教程` : '';
}

function setCategory(attribute, value) {
  document.querySelectorAll(`[${attribute}]`).forEach((button) => {
    const selected = button.getAttribute(attribute) === value;
    button.classList.toggle('selected', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
}
function setupMotion() {
  observer?.disconnect(); stepObserver?.disconnect();
  if (scrollHandler) removeEventListener('scroll', scrollHandler);
  observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
    if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); }
  }), { threshold: .08 });
  document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  const scene = $('.connection-scene');
  if (scene) {
    const steps = [...document.querySelectorAll('.connection-step')];
    scrollHandler = () => {
      const center = innerHeight * .53;
      const closest = steps.reduce((best, step) => {
        const rect = step.getBoundingClientRect();
        const distance = Math.abs(rect.top + rect.height / 2 - center);
        return !best || distance < best.distance ? { step, distance } : best;
      }, null);
      if (closest) scene.dataset.connection = closest.step.dataset.connection;
    };
    addEventListener('scroll', scrollHandler, { passive: true });
    scrollHandler();
  }
}

function render({ focus = false } = {}) {
  disposeInteractions?.();
  disposeChrome?.();
  const path = previewRoute();
  newsCategory = '全部'; supportCategory = '全部';
  let markup;
  let title;
  if (path === '/') { markup = home(); title = '家庭体感游戏机'; }
  else if (path === '/news') { markup = newsPage(); title = '新闻中心'; }
  else if (path === '/support') { markup = supportPage(); title = '技术支持'; }
  else if (path === '/about') { markup = aboutPage(); title = '关于我们'; }
  else if (path === '/buy') { markup = buyPage(); title = '购买渠道'; }
  else if (path.startsWith('/news/')) { const item = news.find((n) => path === '/news/' + n.slug); markup = item ? articlePage(item) : notFound(); title = item?.title || '页面不存在'; }
  else if (path.startsWith('/support/')) { const item = tutorials.find((n) => path === '/support/' + n.slug); markup = item ? articlePage(item, true) : notFound(); title = item?.title || '页面不存在'; }
  else { markup = notFound(); title = '页面不存在'; }
  $('#app').innerHTML = header(path) + markup + footer();
  normalizePreviewLinks();
  document.title = `${title} · 灵境筑梦`;
  document.body.classList.remove('menu-open');
  if ($('#news-search')) { filterNews(); $('#news-search').addEventListener('input', filterNews); }
  if ($('#support-search')) { filterSupport(); $('#support-search').addEventListener('input', filterSupport); }
  setupMotion();
  disposeInteractions = mountInteractions($('#app'));
  disposeChrome = mountSiteChrome($('#app'));
  if (focus) { $('#main').setAttribute('tabindex', '-1'); $('#main').focus({ preventScroll: true }); }
  requestAnimationFrame(() => {
    if (location.hash) { const target = document.getElementById(decodeURIComponent(location.hash.slice(1))); target?.scrollIntoView({ behavior: 'instant' }); }
    else window.scrollTo({ top: 0, behavior: 'instant' });
  });
}
document.addEventListener('click', async (event) => {
  const menu = event.target.closest('.menu-toggle');
  if (menu) {
    const isOpen = menu.getAttribute('aria-expanded') !== 'true';
    menu.setAttribute('aria-expanded', String(isOpen));
    menu.setAttribute('aria-label', isOpen ? '关闭导航菜单' : '打开导航菜单');
    $('#mobile-nav').hidden = !isOpen;
    document.body.classList.toggle('menu-open', isOpen);
    return;
  }
  const pending = event.target.closest('[data-unavailable]');
  if (pending) { toast(`${pending.dataset.unavailable}尚未配置，正式开放后将在此更新。`); return; }
  const newsTab = event.target.closest('[data-news-category]');
  if (newsTab) { newsCategory = newsTab.dataset.newsCategory; setCategory('data-news-category', newsCategory); filterNews(); return; }
  const supportTab = event.target.closest('[data-support-category]');
  if (supportTab) { supportCategory = supportTab.dataset.supportCategory; setCategory('data-support-category', supportCategory); filterSupport(); return; }
  if (event.target.closest('[data-reset-news]')) { newsCategory = '全部'; $('#news-search').value = ''; setCategory('data-news-category', newsCategory); filterNews(); $('#news-search').focus(); return; }
  if (event.target.closest('[data-reset-support]')) { supportCategory = '全部'; $('#support-search').value = ''; setCategory('data-support-category', supportCategory); filterSupport(); $('#support-search').focus(); return; }
  if (event.target.closest('[data-share]')) {
    try { await navigator.clipboard.writeText(location.href); toast('文章链接已复制。'); } catch { toast('请复制浏览器地址栏中的链接进行分享。'); }
    return;
  }
  const link = event.target.closest('a[href]');
  if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.target || link.hasAttribute('download')) return;
  const url = new URL(link.href, location.href);
  if (url.origin !== location.origin) return;
  if (url.pathname === location.pathname && url.hash) {
    const target = document.getElementById(decodeURIComponent(url.hash.slice(1)));
    if (target) { event.preventDefault(); history.pushState({}, '', url); target.scrollIntoView({ behavior: reducedMotion.matches ? 'instant' : 'smooth' }); }
    return;
  }
  event.preventDefault();
  history.pushState({}, '', url);
  render({ focus: true });
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && $('.menu-toggle')?.getAttribute('aria-expanded') === 'true') {
    $('.menu-toggle').click(); $('.menu-toggle').focus();
  }
});
addEventListener('popstate', () => render({ focus: true }));
new MutationObserver(normalizePreviewLinks).observe(document.getElementById('app'), { childList:true, subtree:true });
render();
</script></body></html>
